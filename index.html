<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="loading">
      <p>Loading</p>
      <div class="load"></div>
    </div>
    <!-- Modified Task Management Dashboard -->
    <div class="app">
      <main class="project">
        <div class="project-info">
          <h1></h1>
        </div>
        <div class="project-tasks">
          <div class="project-column" data-status="ready" id="ready">
            <div class="project-column-heading">
              <h2 class="project-column-heading-title"></h2>
            </div>
          </div>
          <div class="project-column" data-status="progress" id="progress">
            <div class="project-column-heading">
              <h2 class="project-column-heading-title"></h2>
            </div>
          </div>
          <div class="project-column" data-status="review" id="review">
            <div class="project-column-heading">
              <h2 class="project-column-heading-title"></h2>
            </div>
          </div>
          <div class="project-column" data-status="done" id="done">
            <div class="project-column-heading">
              <h2 class="project-column-heading-title"></h2>
            </div>
          </div>
        </div>
      </main>
      <aside class="task-details">
        <div class="task-progress">
          <h2></h2>
        </div>
      </aside>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
